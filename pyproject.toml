[project]
name = "reg-monitor"
version = "0.1.0"
description = "Regulatory Monitor — TVS Credit Compliance Automation, Module 1 POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "jinja2",
    "python-multipart",
    "sqlalchemy>=2",
    "alembic",
    "scrapy",
    "feedparser",
    "defusedxml",
    "pymupdf",
    "pdfplumber",
    "apscheduler",
    "pyyaml",
    "openpyxl",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
js = ["scrapy-playwright"]  # only for sources with requires_js
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "crawler"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection style puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
known-first-party = ["app", "regcrawler", "tests"]
