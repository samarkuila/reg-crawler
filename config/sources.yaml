# ---------- eGazette: recent extraordinary gazettes, never the search form ----------
- id: egazette-extraordinary
  authority: eGazette
  page_name: Recent extraordinary gazettes
  type: HTML_LIST
  url: https://egazette.gov.in
  adapter_config:
    selectors: {row: "TODO-prompt-11", title: "TODO-prompt-11", link: "TODO-prompt-11", date: "TODO-prompt-11", ref_no_regex: ""}
    date_format: "%d-%m-%Y"
    ministries: [Finance, MSME, Communications, Telecommunications]
    # Weekly gazettes ("multiple ministries") are always kept as candidates, never dropped by
    # the ministry filter.
    always_keep: ["multiple ministries"]
    use_search_form: false
    selectors_confirmed: false
  include_keywords: *global_include
  exclude_keywords: *global_exclude
  priority: NORMAL
  requires_js: false
  active: true

