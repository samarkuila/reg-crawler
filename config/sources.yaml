# Source register (FR-29, FR-30). Format: docs/architecture.md section 6.
# Import with:  python -m app.cli import-sources config/sources.yaml --actor "<name>"
# Imported sources are PENDING until a different person approves them on the Sources page.
#
# Selectors are PLACEHOLDERS until Prompt 11 ("selectors_confirmed: false"). Listing URLs marked
# "confirm in probe" are the expected pages; the probe (Prompt 14) checks each one.
# Never solve or bypass a verification page: a blocked source is recorded and checked by hand.

# ---------- RBI (every tab Compliance uses, FR-30) ----------
- id: rbi-notifications
  authority: RBI
  page_name: Notifications
  type: HTML_LIST
  url: https://www.rbi.org.in/Scripts/NotificationUser.aspx   # confirm in probe
  rss_url: https://rbi.org.in/notifications_rss.xml
  adapter_config: &rbi_adapter
    selectors: {row: "TODO-prompt-11", title: "TODO-prompt-11", link: "TODO-prompt-11", date: "TODO-prompt-11", ref_no_regex: "RBI/\\d{4}-\\d{2}/\\d+"}
    date_format: "%b %d, %Y"
    max_pages: 2
    selectors_confirmed: false
  include_keywords: &global_include [NBFC, non-banking, regulated entities, all lending institutions, KYC, AML, sanctions, FEMA, DPDP]
  exclude_keywords: &global_exclude [auction, variable rate repo, money market operations, maintenance, downtime, marks obtained, vacancy, recruitment, tender, bid, procurement, citizenship, gross direct premium]
  priority: NORMAL
  requires_js: false
  active: true

- id: rbi-press-releases
  authority: RBI
